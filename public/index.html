<script>
(function () {
  'use strict';
  const { $, esc } = window.U;
  const host = $('#groups');
  const noResult = $('#noResult');

  $('#toolCount').textContent = `目前收錄 ${TOOLS.length} 種工具．${CATEGORIES.length} 個分類`;

  function cardHTML(t) {
    return `<a class="card" href="t/${t.slug}.html">
      <span class="card__top">
        <span class="card__icon" aria-hidden="true">${t.icon}</span>
        <span class="card__title">${esc(t.name)}</span>
      </span>
      <span class="card__desc">${esc(t.desc)}</span>
    </a>`;
  }

  function render(filter) {
    const q = (filter || '').trim().toLowerCase();
    let shown = 0;

    host.innerHTML = CATEGORIES.map(c => {
      let list = byCat(c.id);
      if (q) {
        list = list.filter(t =>
          (t.name + t.desc + t.kw + t.slug).toLowerCase().includes(q));
      }
      if (!list.length) return '';
      shown += list.length;
      return `<section class="group" id="${c.id}">
        <div class="group__head">
          <h2>${c.icon} ${esc(c.name)}</h2>
          <span>${esc(c.desc)}．${list.length} 種</span>
        </div>
        <div class="grid">${list.map(cardHTML).join('')}</div>
      </section>`;
    }).join('');

    noResult.classList.toggle('hidden', shown > 0);
    if (!shown) $('#noResultQ').textContent = filter;
  }

  render('');

  /* 首頁專屬：頂部搜尋框同步過濾卡片，讓使用者也能直接在頁面上篩 */
  const search = $('#siteSearch');
  if (search) {
    search.addEventListener('input', () => {
      const v = search.value;
      // 下拉建議由 layout.js 處理，這裡只負責同步過濾網格
      render(v);
    });
  }

  $('#clearFilter').addEventListener('click', () => {
    if (search) search.value = '';
    render('');
  });

  /* 進站時若網址帶 #分類，捲到該區塊並標記導覽列 */
  function syncCatNav() {
    const id = location.hash.replace('#', '');
    document.querySelectorAll('.catnav a').forEach(a => {
      a.classList.toggle('is-active', a.getAttribute('href').endsWith('#' + id) && !!id);
    });
  }
  addEventListener('hashchange', syncCatNav);
  setTimeout(syncCatNav, 0);
})();
</script>
