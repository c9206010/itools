<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="順手工具箱 — 免費線上小工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf8"/>
      <stop offset="100%" stop-color="#f2efe9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3813c"/>
      <stop offset="100%" stop-color="#e8562a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 右上角的幾何裝飾，呼應站台的橘／青雙色 -->
  <circle cx="1080" cy="96" r="180" fill="#e8562a" opacity="0.07"/>
  <circle cx="1160" cy="240" r="110" fill="#1e4d5c" opacity="0.06"/>
  <rect x="940" y="430" width="200" height="200" rx="40" fill="#e8562a" opacity="0.05"/>

  <!-- 左側直線強調 -->
  <rect x="0" y="0" width="14" height="630" fill="url(#mark)"/>

  <!-- 標誌方塊 -->
  <g transform="translate(96, 150) rotate(-4 44 44)">
    <rect width="88" height="88" rx="22" fill="url(#mark)"/>
    <g fill="#ffffff">
      <rect x="22" y="34" width="44" height="8" rx="4"/>
      <rect x="22" y="50" width="30" height="8" rx="4"/>
      <circle cx="61" cy="54" r="5"/>
    </g>
  </g>

  <text x="96" y="310" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="82" font-weight="800" fill="#1c1a17" letter-spacing="-2">順手工具箱</text>

  <text x="96" y="378" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="34" font-weight="500" fill="#4a453d">打開就能用的免費線上小工具</text>

  <!-- 分類標籤 -->
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="600">
    <g>
      <rect x="96" y="428" width="132" height="50" rx="25" fill="#fdeee8"/>
      <text x="162" y="460" fill="#b83d16" text-anchor="middle">隨機抽籤</text>
    </g>
    <g>
      <rect x="240" y="428" width="132" height="50" rx="25" fill="#e6eff1"/>
      <text x="306" y="460" fill="#1e4d5c" text-anchor="middle">時間計時</text>
    </g>
    <g>
      <rect x="384" y="428" width="132" height="50" rx="25" fill="#fdeee8"/>
      <text x="450" y="460" fill="#b83d16" text-anchor="middle">文字處理</text>
    </g>
    <g>
      <rect x="528" y="428" width="132" height="50" rx="25" fill="#e6eff1"/>
      <text x="594" y="460" fill="#1e4d5c" text-anchor="middle">符號表情</text>
    </g>
    <g>
      <rect x="672" y="428" width="132" height="50" rx="25" fill="#fdeee8"/>
      <text x="738" y="460" fill="#b83d16" text-anchor="middle">編碼換算</text>
    </g>
  </g>

  <text x="96" y="548" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="26" font-weight="500" fill="#7a7266">40 種工具．免安裝免註冊．資料只留在你的瀏覽器</text>
</svg>
